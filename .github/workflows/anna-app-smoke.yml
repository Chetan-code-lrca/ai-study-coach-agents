name: Anna App Smoke Check

on:
  push:
    branches: ["main", "feat/anna-study-coach-mvp", "fix/anna-study-coach-runtime", "fix/study-coach-direct-llm"]
    paths:
      - "anna-app/**"
      - ".github/workflows/anna-app-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "anna-app/**"
      - ".github/workflows/anna-app-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Anna CLI
        run: npm install --global @anna-ai/cli

      - name: Build the self-contained frontend bundle
        working-directory: anna-app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Validate Anna App manifest and bundle
        working-directory: anna-app
        run: anna-app validate --strict

      - name: Run prompt and Markdown tests
        working-directory: anna-app
        run: npm test

      - name: Run manifest and frontend contract tests
        working-directory: anna-app
        run: python -m unittest discover -s tests -v

      - name: Check app JavaScript syntax
        run: |
          cp anna-app/bundle/app.js /tmp/anna-study-coach.mjs
          node --check /tmp/anna-study-coach.mjs

