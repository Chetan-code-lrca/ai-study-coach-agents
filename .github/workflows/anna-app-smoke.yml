name: Anna App Smoke Check

on:
  push:
    branches: ["main", "feat/anna-study-coach-mvp", "fix/anna-study-coach-runtime"]
    paths:
      - "anna-app/**"
      - ".github/workflows/anna-app-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "anna-app/**"
      - ".github/workflows/anna-app-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Anna CLI
        run: npm install --global @anna-ai/cli

      - name: Validate Anna App manifest and bundle
        working-directory: anna-app
        run: anna-app validate --strict

      - name: Run offline unit and contract tests
        working-directory: anna-app
        run: python -m unittest discover -s tests -v

      - name: Check app JavaScript syntax
        run: |
          cp anna-app/bundle/app.js /tmp/anna-study-coach.mjs
          node --check /tmp/anna-study-coach.mjs

      - name: Verify pinned browser document parsers
        run: |
          curl --fail --silent --show-error --output /dev/null https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.min.mjs
          curl --fail --silent --show-error --output /dev/null https://cdn.jsdelivr.net/npm/pdfjs-dist@6.4.299/build/pdf.worker.min.mjs
          curl --fail --silent --show-error --output /dev/null https://cdn.jsdelivr.net/npm/mammoth@1.13.0/mammoth.browser.min.js

      - name: Exercise Executa startup and reverse sampling
        run: python anna-app/tests/smoke_executa.py

      - name: Compile the Executa sources
        run: python -m py_compile anna-app/executas/study-coach/study_logic.py anna-app/executas/study-coach/study_coach_plugin.py
