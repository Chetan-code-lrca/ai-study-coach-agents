name: Anna App Smoke Check

on:
  push:
    branches: ["main", "feat/anna-study-coach-mvp", "fix/anna-study-coach-runtime"]
    paths:
      - "anna-app/**"
      - ".github/workflows/anna-app-smoke.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "anna-app/**"
      - ".github/workflows/anna-app-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Anna CLI
        run: npm install --global @anna-ai/cli

      - name: Validate Anna App manifest and bundle
        working-directory: anna-app
        run: anna-app validate --strict

      - name: Run offline unit and contract tests
        working-directory: anna-app
        run: python -m unittest discover -s tests -v

      - name: Check app JavaScript syntax
        run: |
          cp anna-app/bundle/app.js /tmp/anna-study-coach.mjs
          node --check /tmp/anna-study-coach.mjs

      - name: Verify Executa installs and answers JSON-RPC
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          project = Path("anna-app/executas/study-coach")
          requests = [
              {"jsonrpc": "2.0", "method": "describe", "id": 1},
              {"jsonrpc": "2.0", "method": "health", "id": 2},
          ]
          proc = subprocess.run(
              ["uv", "run", "--project", str(project), "tool-dev-ai-study-coach"],
              input="\\n".join(json.dumps(item) for item in requests) + "\\n",
              capture_output=True,
              text=True,
              timeout=240,
          )
          print(proc.stderr)
          if proc.returncode:
              raise SystemExit(f"Executa exited with {proc.returncode}:\\n{proc.stdout}\\n{proc.stderr}")

          frames = []
          for line in proc.stdout.splitlines():
              try:
                  frames.append(json.loads(line))
              except json.JSONDecodeError:
                  continue
          by_id = {frame.get("id"): frame for frame in frames}
          assert 1 in by_id and "result" in by_id[1], f"describe failed: {proc.stdout}"
          assert by_id[1]["result"]["tools"][0]["name"] == "study_coach"
          assert "llm.sample" in by_id[1]["result"]["host_capabilities"]
          assert 2 in by_id and by_id[2]["result"]["status"] == "healthy"
          print("Executa describe + health JSON-RPC checks passed.")
          PY

      - name: Compile the Executa sources
        run: python -m py_compile anna-app/executas/study-coach/study_logic.py anna-app/executas/study-coach/study_coach_plugin.py
